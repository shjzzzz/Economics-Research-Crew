<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A7BB5" letter-spacing="1.5">PART 01 · 基础概念 (04 / 08)</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">基础 ④ | Subagents：上下文隔离与专才分工</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <!-- Left: Orchestration Diagram -->
  <rect x="64" y="146" width="600" height="510" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="64" y="146" width="600" height="46" fill="#1A3A6B"/>
  <use data-icon="tabler-outline/users" x="82" y="156" width="24" height="24" fill="#E8A317"/>
  <text x="116" y="176" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">主从委派架构（Main Agent → Subagents）</text>

  <!-- User & Main Agent -->
  <rect x="234" y="212" width="260" height="54" rx="4" fill="#FFFFFF" stroke="#1A3A6B" stroke-width="1.5"/>
  <text x="364" y="245" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">User（提出复杂任务）</text>

  <line x1="364" y1="266" x2="364" y2="294" stroke="#4A7BB5" stroke-width="2"/>
  <polygon points="358,290 370,290 364,298" fill="#4A7BB5"/>

  <rect x="194" y="298" width="340" height="72" rx="4" fill="#1A3A6B"/>
  <text x="364" y="328" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Main Agent（协调者）</text>
  <text x="364" y="354" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#DCE6F2">拆解任务 · 委派子代理 · 汇总最终结果</text>

  <!-- Branch Lines -->
  <line x1="364" y1="370" x2="364" y2="404" stroke="#4A7BB5" stroke-width="2"/>
  <line x1="164" y1="404" x2="564" y2="404" stroke="#4A7BB5" stroke-width="2"/>
  <line x1="164" y1="404" x2="164" y2="430" stroke="#4A7BB5" stroke-width="2"/>
  <line x1="364" y1="404" x2="364" y2="430" stroke="#4A7BB5" stroke-width="2"/>
  <line x1="564" y1="404" x2="564" y2="430" stroke="#4A7BB5" stroke-width="2"/>

  <!-- 3 Subagents -->
  <rect x="82" y="430" width="164" height="122" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="164" y="462" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">Code Reviewer</text>
  <text x="164" y="490" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#5A6577">独立上下文窗口</text>
  <text x="164" y="514" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#5A6577">只读权限 + 审查</text>
  <text x="164" y="538" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#4A7BB5">仅返回结论摘要</text>

  <rect x="282" y="430" width="164" height="122" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="364" y="462" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">Test Engineer</text>
  <text x="364" y="490" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#5A6577">独立上下文窗口</text>
  <text x="364" y="514" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#5A6577">写测试 + 跑命令</text>
  <text x="364" y="538" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#4A7BB5">不污染主会话</text>

  <rect x="482" y="430" width="164" height="122" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="564" y="462" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">Docs Writer</text>
  <text x="564" y="490" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#5A6577">独立上下文窗口</text>
  <text x="564" y="514" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#5A6577">定制文档提示词</text>
  <text x="564" y="538" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#4A7BB5">支持并行执行</text>

  <rect x="82" y="574" width="564" height="62" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <text x="102" y="601" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#C07B00">支持嵌套委派（v2.1.219 默认深度 3 层）：</text>
  <text x="102" y="625" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#1D2430">Subagent 还可派生下级 Subagent；可通过 CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH 调节。</text>

  <!-- Right: 4 Core Benefits -->
  <rect x="692" y="146" width="524" height="510" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="692" y="146" width="524" height="46" fill="#4A7BB5"/>
  <text x="714" y="176" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">Subagents 的 4 个核心工程价值</text>

  <text x="716" y="230" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">1. 上下文窗口隔离（最重要）</text>
  <text x="716" y="260" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">读几十篇文献或大量代码的过程留在子代理内部，</text>
  <text x="716" y="284" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">只把精炼结论返还主代理，防止主会话上下文爆炸。</text>

  <line x1="716" y1="306" x2="1192" y2="306" stroke="#DCE2EA" stroke-width="1"/>

  <text x="716" y="340" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">2. 工具权限最小化裁剪</text>
  <text x="716" y="370" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">可在 .claude/agents/*.md 中指定 tools 列表，</text>
  <text x="716" y="394" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">例如让审稿人只有 Read/Grep 权限，无法改文件。</text>

  <line x1="716" y1="416" x2="1192" y2="416" stroke="#DCE2EA" stroke-width="1"/>

  <text x="716" y="450" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">3. 独立视角的客观性</text>
  <text x="716" y="480" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">不继承主会话的历史推理偏见，适合做对抗式</text>
  <text x="716" y="504" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">代码审查或学术论文审稿。</text>

  <line x1="716" y1="526" x2="1192" y2="526" stroke="#DCE2EA" stroke-width="1"/>

  <text x="716" y="560" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">4. 生命周期可被 Hook 观测</text>
  <text x="716" y="590" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">配合 SubagentStart / SubagentStop 事件记录账本</text>
  <text x="716" y="614" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1A3A6B" font-weight="bold">→ 对应 Part 2：7 个科研 Subagent 与质量闭环</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Part 1 · Claude Code 基础概念（claude-howto）</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">07 / 18</text>
</svg>
