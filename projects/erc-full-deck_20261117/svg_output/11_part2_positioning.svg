<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317" letter-spacing="1.5">PART 02 · ECONOMICS RESEARCH CREW 科研实战</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">Part 2 | 不是计量软件，而是 AI 科研的“工程护栏”</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <rect x="64" y="144" width="556" height="44" rx="4" fill="#F4F6F8"/>
  <use data-icon="tabler-outline/alert-triangle" x="80" y="154" width="24" height="24" fill="#C0392B"/>
  <text x="116" y="173" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1D2430">通用 AI 直接做科研的 4 大失控风险</text>

  <rect x="660" y="144" width="556" height="44" rx="4" fill="#1A3A6B"/>
  <use data-icon="tabler-outline/shield-check" x="676" y="154" width="24" height="24" fill="#E8A317"/>
  <text x="712" y="173" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Economics Research Crew 的工程对策</text>

  <rect x="64" y="204" width="556" height="86" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="84" y="236" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#C0392B">1. 幻觉与编造证据</text>
  <text x="84" y="268" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5A6577">凭空捏造论文 DOI、税法条文号、回归系数或样本量</text>

  <rect x="660" y="204" width="556" height="86" rx="4" fill="#F4F6F8" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="680" y="236" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">证据铁律 + 账本机械绑定</text>
  <text x="680" y="268" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">查不到一律标“待核实”；引文 [@key] 与数字 {{res:id}} 锁死账本</text>

  <rect x="64" y="304" width="556" height="86" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="84" y="336" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#C0392B">2. 跳过识别直接跑回归</text>
  <text x="84" y="368" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5A6577">把相关当因果，未定义 Estimand 与假设就输出回归脚本</text>

  <rect x="660" y="304" width="556" height="86" rx="4" fill="#F4F6F8" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="680" y="336" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">强制阶段门控 (S1–S7) + 独立审稿</text>
  <text x="680" y="368" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">先过识别审计 (/causal-inference-audit)，再执行与对抗审查</text>

  <rect x="64" y="404" width="556" height="86" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="84" y="436" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#C0392B">3. 误改原始数据与笔记</text>
  <text x="84" y="468" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5A6577">在清洗或整理时覆盖 raw 数据、删除或批量改写原有笔记</text>

  <rect x="660" y="404" width="556" height="86" rx="4" fill="#F4F6F8" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="680" y="436" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">Hook 技术拦截 + 安装不覆盖</text>
  <text x="680" y="468" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">protect_raw.py 锁死 raw 与 _sources；工具权限按代理最小化</text>

  <rect x="64" y="504" width="556" height="86" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="84" y="536" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#C0392B">4. 会话结束知识清零</text>
  <text x="84" y="568" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5A6577">每次新开对话都要重喂文献与研究进度，难以长期积累</text>

  <rect x="660" y="504" width="556" height="86" rx="4" fill="#F4F6F8" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="680" y="536" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">可积累 Wiki + STATE.json 断点续跑</text>
  <text x="680" y="568" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">三层知识库持续沉淀，研究状态与交接产物落盘可续接</text>

  <rect x="64" y="610" width="1152" height="52" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <text x="84" y="642" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1D2430">重要边界：</text>
  <text x="182" y="642" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#1D2430">本项目不含 Stata/R/Python 计量引擎，不自动跑回归；脚本、数据、环境与研究判断权永远由研究者确认。</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Part 2 · Economics Research Crew 科研实战</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">11 / 18</text>
</svg>
