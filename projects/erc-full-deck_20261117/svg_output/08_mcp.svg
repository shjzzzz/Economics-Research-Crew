<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A7BB5" letter-spacing="1.5">PART 01 · 基础概念 (05 / 08)</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">基础 ⑤ | MCP：连接外部工具与实时数据的协议</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <!-- Top Architecture Diagram -->
  <text x="64" y="158" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A3A6B">MCP (Model Context Protocol) 标准化连接架构</text>

  <rect x="64" y="182" width="260" height="176" rx="4" fill="#1A3A6B"/>
  <use data-icon="tabler-outline/terminal-2" x="86" y="206" width="28" height="28" fill="#E8A317"/>
  <text x="124" y="228" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Claude Code</text>
  <text x="86" y="264" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#DCE6F2">MCP Client（发起工具调用）</text>
  <text x="86" y="294" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#E8A317">• /mcp 管理连接状态</text>
  <text x="86" y="318" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#E8A317">• 支持按需延迟加载工具</text>

  <line x1="324" y1="242" x2="404" y2="242" stroke="#4A7BB5" stroke-width="2.5"/>
  <polygon points="400,236 410,242 400,248" fill="#4A7BB5"/>
  <text x="364" y="232" text-anchor="middle" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#4A7BB5">JSON-RPC</text>

  <line x1="410" y1="298" x2="330" y2="298" stroke="#E8A317" stroke-width="2.5"/>
  <polygon points="334,292 324,298 334,304" fill="#E8A317"/>
  <text x="368" y="320" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#C07B00">实时返回结果</text>

  <rect x="410" y="182" width="320" height="176" rx="4" fill="#F4F6F8" stroke="#4A7BB5" stroke-width="2"/>
  <use data-icon="tabler-outline/plug" x="432" y="206" width="28" height="28" fill="#4A7BB5"/>
  <text x="470" y="228" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">MCP Server（适配层）</text>
  <text x="432" y="264" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">将外部 API / DB 暴露为标准工具</text>
  <text x="432" y="294" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">• 统一认证（OAuth / Token / 密钥）</text>
  <text x="432" y="320" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">• 配置在 .mcp.json（可共享）</text>

  <line x1="730" y1="270" x2="800" y2="270" stroke="#4A7BB5" stroke-width="2.5"/>
  <polygon points="796,264 806,270 796,276" fill="#4A7BB5"/>

  <!-- External Services -->
  <rect x="806" y="182" width="410" height="176" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="826" y="214" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">常见外部服务生态（claude-howto）</text>
  <text x="826" y="246" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Filesystem：本地文件读写（OS 权限）</text>
  <text x="826" y="274" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• GitHub：查 PR / Issue / 推送代码（OAuth）</text>
  <text x="826" y="302" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Database：PostgreSQL / MySQL 实时查询</text>
  <text x="826" y="330" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Slack / Google Docs：团队消息与云端文档</text>

  <!-- Bottom Contrast: Memory vs MCP & ERC Choice -->
  <rect x="64" y="388" width="560" height="266" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="64" y="388" width="560" height="44" fill="#4A7BB5"/>
  <text x="84" y="417" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Memory (CLAUDE.md) vs. MCP</text>
  <text x="84" y="466" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">• Memory：静态、跨会话的“背景知识与规则”</text>
  <text x="100" y="494" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">如代码规范、目录约定、研究伦理要求。</text>
  <text x="84" y="534" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">• MCP：动态、实时的“外部动作与最新状态”</text>
  <text x="100" y="562" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">如查询线上数据库最新记录、创建 GitHub Issue、读取实时文档。</text>
  <text x="84" y="616" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A7BB5">两者互补：用 Memory 约束行为，用 MCP 获取实时信息。</text>

  <rect x="656" y="388" width="560" height="266" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <rect x="656" y="388" width="560" height="44" fill="#E8A317"/>
  <text x="676" y="417" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1D2430">工程启示：为什么 Part 2 默认不装 MCP？</text>
  <text x="676" y="466" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">Economics Research Crew 在 README 中明确声明：</text>
  <text x="676" y="498" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#C07B00">“不覆盖已有 .mcp.json，也不默认安装任何 MCP”</text>
  <text x="676" y="536" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">原因：经济学研究常涉及受限微观数据或未公开手稿，</text>
  <text x="676" y="564" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">减少默认外部连接面可以降低敏感数据外发风险，</text>
  <text x="676" y="592" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">仅在 paper_tools 核验文献时只发送标题/DOI（且可离线）。</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Part 1 · Claude Code 基础概念（claude-howto）</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">08 / 18</text>
</svg>
