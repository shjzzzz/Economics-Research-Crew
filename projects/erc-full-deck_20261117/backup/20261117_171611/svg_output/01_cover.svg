<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Left Hero Navy Field -->
  <rect x="0" y="0" width="760" height="720" fill="#1A3A6B"/>
  <rect x="64" y="116" width="72" height="6" fill="#E8A317"/>
  <text x="64" y="162" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#E8A317" letter-spacing="1.5">CLAUDE-HOWTO  ×  ECONOMICS RESEARCH CREW</text>
  <text x="64" y="236" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">从 Claude Code 核心概念</text>
  <text x="64" y="298" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">到经济学研究实战</text>
  <text x="64" y="366" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#DCE6F2">先理解 CLAUDE.md / Skills / MCP / Hooks / Worktree 等底座原语，</text>
  <text x="64" y="400" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#DCE6F2">再拆解它们如何组装成“可追溯、可审查、可积累”的科研护栏。</text>

  <!-- Two-Part Tags -->
  <rect x="64" y="468" width="296" height="68" rx="4" fill="#274E8A"/>
  <text x="84" y="496" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317">PART 01 · 基础底座</text>
  <text x="84" y="522" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#FFFFFF">8 大核心概念（claude-howto）</text>

  <rect x="380" y="468" width="316" height="68" rx="4" fill="#274E8A"/>
  <text x="400" y="496" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317">PART 02 · 科研实战</text>
  <text x="400" y="522" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#FFFFFF">Economics Research Crew 架构</text>

  <line x1="64" y1="612" x2="696" y2="612" stroke="#365D99" stroke-width="1.5"/>
  <text x="64" y="648" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#B8C9E0">适用平台：Claude Code  ·  Antigravity CLI (agy)  ·  Codex CLI</text>

  <!-- Right Side: Concept Stack -->
  <text x="804" y="132" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#5A6577">本场分享双主线</text>
  <line x1="804" y1="148" x2="1216" y2="148" stroke="#DCE2EA" stroke-width="1.5"/>

  <rect x="804" y="172" width="412" height="218" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="804" y="172" width="6" height="218" fill="#4A7BB5"/>
  <use data-icon="tabler-outline/package" x="828" y="192" width="28" height="28" fill="#4A7BB5"/>
  <text x="868" y="213" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">Part 1：Claude Code 8 大原语</text>
  <text x="828" y="250" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• CLAUDE.md（7 层记忆）  • Slash Commands</text>
  <text x="828" y="280" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• Skills（自动能力包）   • Subagents（隔离）</text>
  <text x="828" y="310" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• MCP（外部实时协议）   • Hooks（事件拦截）</text>
  <text x="828" y="340" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• Git Worktree（并行）   • Plugins（打包）</text>

  <rect x="804" y="412" width="412" height="218" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <rect x="804" y="412" width="6" height="218" fill="#E8A317"/>
  <use data-icon="tabler-outline/shield-check" x="828" y="432" width="28" height="28" fill="#C07B00"/>
  <text x="868" y="453" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">Part 2：科研工程护栏实战</text>
  <text x="828" y="490" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• 科研 Rules（证据铁律与计量纪律）</text>
  <text x="828" y="520" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• 14 Skills + 7 Subagents（含只读审稿）</text>
  <text x="828" y="550" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• S1–S12 状态机 + 6 个安全 Hooks</text>
  <text x="828" y="580" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• 可积累 Wiki + 论文账本机械追溯</text>
</svg>
