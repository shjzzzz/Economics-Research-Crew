<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#1A3A6B"/>
  <rect x="64" y="48" width="64" height="6" fill="#E8A317"/>
  <text x="64" y="84" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317" letter-spacing="1.5">PART 02 · 多平台适配与快速上手</text>
  <text x="64" y="130" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">总结与上手 | 单一源多平台分发 &amp; 3 步无损接入</text>

  <!-- Top: Platform Comparison Table -->
  <rect x="64" y="156" width="1152" height="40" fill="#274E8A"/>
  <text x="84" y="182" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317">平台（唯一维护源：payload/.claude/）</text>
  <text x="410" y="182" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">规则 / Skills / Agents</text>
  <text x="760" y="182" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Hooks (-WithHooks)</text>
  <text x="1060" y="182" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">验证状态</text>

  <rect x="64" y="196" width="1152" height="52" fill="#FFFFFF"/>
  <text x="84" y="228" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">Claude Code（完整版）</text>
  <text x="410" y="228" font-family="Consolas, Arial, sans-serif" font-size="14" fill="#1D2430">CLAUDE.md + .claude/{skills,agents}</text>
  <text x="760" y="228" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1A3A6B">全量 Hook（含编排强拦截）</text>
  <text x="1060" y="228" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#137333">已完整测试</text>

  <rect x="64" y="248" width="1152" height="52" fill="#F4F6F8"/>
  <text x="84" y="280" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">Antigravity CLI (agy)</text>
  <text x="410" y="280" font-family="Consolas, Arial, sans-serif" font-size="14" fill="#1D2430">AGENTS.md(≤24KB) + .agents/</text>
  <text x="760" y="280" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">raw 保护(ask) + 路由；无编排拦截</text>
  <text x="1060" y="280" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C07B00">agy 1.5.9 冒烟</text>

  <rect x="64" y="300" width="1152" height="52" fill="#FFFFFF"/>
  <text x="84" y="332" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">Codex CLI</text>
  <text x="410" y="332" font-family="Consolas, Arial, sans-serif" font-size="14" fill="#1D2430">AGENTS.md + .agents/</text>
  <text x="760" y="332" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">无 Hook，靠规则文本约束</text>
  <text x="1060" y="332" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">仅生成·未实测</text>

  <!-- Bottom: 3 Steps Quick Start -->
  <rect x="64" y="376" width="366" height="206" rx="4" fill="#FFFFFF"/>
  <text x="84" y="408" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#C07B00">STEP 01 · 预演与安装</text>
  <text x="84" y="438" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#1A3A6B">.\Install-EconomicsResearchCrew.ps1</text>
  <text x="84" y="462" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#1A3A6B">  -VaultPath "D:\YourVault"</text>
  <text x="84" y="486" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#1A3A6B">  -WithHooks -WhatIf</text>
  <text x="84" y="528" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">不覆盖已有配置，改前备份至 _erc-backups/</text>
  <text x="84" y="556" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A7BB5">-Platform auto|claude|agy|codex|all</text>

  <rect x="457" y="376" width="366" height="206" rx="4" fill="#FFFFFF"/>
  <text x="477" y="408" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#C07B00">STEP 02 · 结构与回归校验</text>
  <text x="477" y="438" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#1A3A6B">.\Test-EconomicsResearchCrew.ps1</text>
  <text x="477" y="462" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#1A3A6B">  -VaultPath "D:\YourVault"</text>
  <text x="477" y="494" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#5A6577">pwsh -NoProfile -File tests\run.ps1</text>
  <text x="477" y="528" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">校验 frontmatter、脚本与 hooks.json</text>
  <text x="477" y="556" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A7BB5">回归测试全在临时目录执行，不碰真实库</text>

  <rect x="850" y="376" width="366" height="206" rx="4" fill="#FFFFFF"/>
  <text x="870" y="408" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#C07B00">STEP 03 · 首次只读体检</text>
  <text x="870" y="440" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">进入研究库启动 claude 或 agy，先执行：</text>
  <text x="870" y="470" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#1A3A6B">“读取规则与 Meta/vault-map.md，只检查</text>
  <text x="870" y="494" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#1A3A6B">配置与目录，报告 Agent 与 Skills。”</text>
  <text x="870" y="528" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">填好 Meta/purpose.md 后即可用</text>
  <text x="870" y="556" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A7BB5">/causal-inference-audit 做首次冒烟</text>

  <!-- Closing Banner -->
  <rect x="64" y="602" width="1152" height="58" rx="4" fill="#274E8A" stroke="#E8A317" stroke-width="2"/>
  <text x="640" y="638" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#E8A317">用 Claude Code 原语筑起工程护栏，把学术判断权稳稳留给研究者</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#365D99" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#B8C9E0">Claude Code 基础概念 × Economics Research Crew</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#E8A317">18 / 18</text>
</svg>
