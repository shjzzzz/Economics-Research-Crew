<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A7BB5" letter-spacing="1.5">PART 01 · 基础概念 (07 &amp; 08 / 08)</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">基础 ⑦⑧ | Git Worktree（并行隔离）与 Plugins</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <!-- Left Half: Git Worktree -->
  <rect x="64" y="146" width="560" height="510" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="64" y="146" width="560" height="48" fill="#1A3A6B"/>
  <use data-icon="tabler-outline/git-branch" x="84" y="157" width="26" height="26" fill="#E8A317"/>
  <text x="122" y="177" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">⑦ Git Worktree：多分支并行隔离</text>

  <text x="88" y="226" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">解决什么痛点？</text>
  <text x="88" y="254" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">多个 AI 会话同时改同一个仓库目录会互相覆盖；</text>
  <text x="88" y="278" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">Worktree 让每个会话拥有独立分支工作区，无需 stash。</text>

  <rect x="88" y="302" width="512" height="86" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="106" y="330" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">claude --worktree &lt;name&gt;  (或 claude -w)</text>
  <text x="106" y="358" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">创建路径：&lt;repo&gt;/.claude/worktrees/&lt;name&gt;</text>
  <text x="106" y="378" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#4A7BB5">若会话结束无改动，worktree 会自动清理</text>

  <text x="88" y="424" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">关键机制（claude-howto 09-advanced-features）：</text>
  <text x="88" y="456" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 后台隔离 worktree.bgIsolation：默认给后台任务</text>
  <text x="102" y="480" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">分配独立 worktree（设 "none" 则直接改当前目录）</text>
  <text x="88" y="512" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 稀疏检出 worktree.sparsePaths：加速大仓库克隆</text>
  <text x="88" y="544" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 会话内工具：EnterWorktree / ExitWorktree</text>
  <text x="88" y="576" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 生命周期 Hook：WorktreeCreate / WorktreeRemove</text>
  <text x="88" y="618" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">→ 适用于：同时跑多组稳健性检验或并行代码分支</text>

  <!-- Right Half: Plugins -->
  <rect x="656" y="146" width="560" height="510" rx="4" fill="#FFFFFF" stroke="#1A3A6B" stroke-width="1.5"/>
  <rect x="656" y="146" width="560" height="48" fill="#4A7BB5"/>
  <use data-icon="tabler-outline/package" x="676" y="157" width="26" height="26" fill="#FFFFFF"/>
  <text x="714" y="177" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">⑧ Plugins：最高层级的生态打包机制</text>

  <text x="680" y="226" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">什么是 Plugin？</text>
  <text x="680" y="254" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">把前面学过的所有扩展能力打包成一个可共享的安装包，</text>
  <text x="680" y="278" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">一条命令即可在任意项目加载完整工作流。</text>

  <rect x="680" y="302" width="512" height="104" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="698" y="330" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">清单文件：.claude-plugin/plugin.json</text>
  <text x="698" y="358" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">一次打包：Slash Commands + Skills + Subagents +</text>
  <text x="698" y="382" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">MCP Servers + Hooks（本地测试：claude --plugin-dir）</text>

  <text x="680" y="442" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">4 类分发范围（claude-howto 07-plugins）：</text>
  <text x="680" y="474" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Official（官方）：Anthropic 提供，如 PR Review</text>
  <text x="680" y="506" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Community（社区）：开源 DevOps / Data Science</text>
  <text x="680" y="538" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Organization（组织）：公司内部规范与工具包</text>
  <text x="680" y="570" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Personal（个人）：开发者自用工作流合集</text>

  <rect x="680" y="596" width="512" height="44" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <text x="700" y="624" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C07B00">Part 1 小结：8 个原语齐备 → 下面进入 Part 2 科研实战！</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Part 1 · Claude Code 基础概念（claude-howto）</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">10 / 18</text>
</svg>
