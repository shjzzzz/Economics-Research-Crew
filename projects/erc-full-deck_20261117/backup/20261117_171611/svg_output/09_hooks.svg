<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A7BB5" letter-spacing="1.5">PART 01 · 基础概念 (06 / 08)</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">基础 ⑥ | Hooks：事件驱动的确定性自动化与拦截</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <!-- Top: 5 Hook Types & Overview -->
  <rect x="64" y="142" width="1152" height="72" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="84" y="172" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">核心定位（claude-howto）：配置在 ~/.claude/settings.json 或 .claude/settings.json，无需 AI “自觉遵守”</text>
  <text x="84" y="200" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">支持 33 种生命周期事件  ·  5 种实现载体：command（本地脚本） · http · mcp_tool · prompt · agent</text>

  <!-- 3 Columns of Lifecycle Events -->
  <rect x="64" y="232" width="366" height="330" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <rect x="64" y="232" width="366" height="44" fill="#1A3A6B"/>
  <text x="84" y="261" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1. 会话与输入阶段</text>
  <text x="84" y="308" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">SessionStart / SessionEnd</text>
  <text x="84" y="332" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">环境初始化、会话结束清理与日志</text>
  <text x="84" y="372" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">InstructionsLoaded</text>
  <text x="84" y="396" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">CLAUDE.md 或规则加载时校验增强</text>
  <text x="84" y="436" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">UserPromptSubmit</text>
  <text x="84" y="460" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">用户提交提问时做输入校验或注入提示</text>
  <text x="84" y="500" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">PreCompact / PostCompact</text>
  <text x="84" y="524" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">上下文压缩前后保存关键状态</text>

  <rect x="457" y="232" width="366" height="330" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="2"/>
  <rect x="457" y="232" width="366" height="44" fill="#E8A317"/>
  <text x="477" y="261" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1D2430">2. 工具调用前后（最常用）</text>
  <text x="477" y="308" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#C0392B">PreToolUse</text>
  <text x="477" y="332" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">工具执行前拦截（如 Edit/Write/Bash），</text>
  <text x="477" y="354" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">用于安全检查、路径保护与审批门控</text>
  <text x="477" y="394" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">PermissionRequest / Denied</text>
  <text x="477" y="418" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">自动审批流或策略拒绝日志</text>
  <text x="477" y="458" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">PostToolUse / Failure</text>
  <text x="477" y="482" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">工具成功后自动格式化（如 prettier）、</text>
  <text x="477" y="504" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">检查 YAML frontmatter 或发送告警</text>

  <rect x="850" y="232" width="366" height="330" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <rect x="850" y="232" width="366" height="44" fill="#4A7BB5"/>
  <text x="870" y="261" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3. 子代理、分支与响应结束</text>
  <text x="870" y="308" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">SubagentStart / SubagentStop</text>
  <text x="870" y="332" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">子代理派生时注入上下文，结束时验产物</text>
  <text x="870" y="372" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">WorktreeCreate / Remove</text>
  <text x="870" y="396" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">自定义 Git Worktree 创建与资源清理</text>
  <text x="870" y="436" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">Stop / TaskCompleted</text>
  <text x="870" y="460" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">回答完成或任务完结时触发收尾检查</text>
  <text x="870" y="500" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">PreModelSwitch / ConfigChange</text>
  <text x="870" y="524" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">模型切换门控与配置变更传播</text>

  <!-- Bottom Config Example -->
  <rect x="64" y="580" width="1152" height="78" rx="4" fill="#1A3A6B"/>
  <text x="84" y="610" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317">settings.json 典型用法（matcher 精确匹配工具名）：</text>
  <text x="84" y="638" font-family="Consolas, Arial, sans-serif" font-size="14" fill="#FFFFFF">"PreToolUse": [{"matcher": "Edit|Write", "hooks": [{"type": "command", "command": "python protect_raw.py"}]}]</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Part 1 · Claude Code 基础概念（claude-howto）</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">09 / 18</text>
</svg>
