<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317" letter-spacing="1.5">PART 02 · 科研落地 ①</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">科研落地 ① | Rules（铁律）与 14 个 Skills（SOP）</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <!-- Left: 3 Research Rules Pillars -->
  <rect x="64" y="144" width="480" height="512" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="64" y="144" width="480" height="46" fill="#1A3A6B"/>
  <!-- icon: tabler-outline/shield-check -->
  <g transform="translate(82, 154)" fill="none" stroke="#E8A317" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
  <text x="116" y="174" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">Rules：CLAUDE.md / AGENTS.md 科研宪法</text>

  <rect x="84" y="208" width="440" height="132" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="104" y="238" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">1. 证据铁律</text>
  <text x="104" y="268" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 严禁编造论文、DOI、法条、数据或结果；查不到标“待核实”</text>
  <text x="104" y="294" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">• 中国税法须写明发文机关、文号、生效日期与废止状态</text>
  <text x="104" y="320" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#4A7BB5">• 严格区分：来源事实 vs. 模型解释 vs. 研究者假说</text>

  <rect x="84" y="356" width="440" height="136" rx="4" fill="#FFFFFF" stroke="#E8A317" stroke-width="1.5"/>
  <text x="104" y="386" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#C07B00">2. 计量纪律</text>
  <text x="104" y="416" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 区分相关、预测与因果；先定 Estimand 再跑回归</text>
  <text x="104" y="442" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">• DID/IV/RDD 各自核查假设与安慰剂检验</text>
  <text x="104" y="468" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">• 明确聚类层级与样本处理；禁止静默删样本或改设定</text>

  <rect x="84" y="508" width="440" height="128" rx="4" fill="#FFFFFF" stroke="#1A3A6B" stroke-width="1.5"/>
  <text x="104" y="538" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">3. 数据与笔记安全</text>
  <text x="104" y="568" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 06-Data/raw 与 03-Literature/_sources 绝对只读</text>
  <text x="104" y="594" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">• 衍生数据仅写 processed；不删除或批量改写既有笔记</text>
  <text x="104" y="620" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#4A7BB5">• 受限微观数据严禁外发给外部服务</text>

  <!-- Right: 14 Skills Grouped -->
  <rect x="568" y="144" width="648" height="512" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="568" y="144" width="648" height="46" fill="#4A7BB5"/>
  <!-- icon: tabler-outline/terminal-2 -->
  <g transform="translate(586, 154)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M8 9l3 3l-3 3" />
    <path d="M13 15l3 0" />
    <path d="M3 6a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -12" />
  </g>
  <text x="620" y="174" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">14 个 Skills：在本库内优先于全局技能</text>

  <text x="590" y="222" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">研究推进（7 个）</text>
  <text x="590" y="252" font-family="Consolas, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">/research-question</text>
  <text x="802" y="252" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">选题收敛与 Estimand（≤3 候选）</text>
  <text x="590" y="278" font-family="Consolas, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">/literature-review</text>
  <text x="802" y="278" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">带来源文献矩阵与研究缺口</text>
  <text x="590" y="304" font-family="Consolas, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">/theory-modeling</text>
  <text x="802" y="304" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">模型推导与可检验推论</text>
  <text x="590" y="330" font-family="Consolas, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">/tax-policy-analysis</text>
  <text x="802" y="330" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">税制法源、征管遵从与归宿</text>
  <text x="590" y="356" font-family="Consolas, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">/causal-inference-audit</text>
  <text x="802" y="356" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">DID/IV/RDD 识别审计与措辞边界</text>
  <text x="590" y="382" font-family="Consolas, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">/econometric-analysis</text>
  <text x="802" y="382" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">数据审计、回归与论文复现</text>
  <text x="590" y="408" font-family="Consolas, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">/academic-review</text>
  <text x="802" y="408" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">Fatal / Major / Minor 分级挑刺</text>

  <line x1="590" y1="426" x2="1194" y2="426" stroke="#DCE2EA" stroke-width="1"/>

  <text x="590" y="454" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">Wiki 维护（3 个） &amp; 论文写作（3 个）</text>
  <text x="590" y="484" font-family="Consolas, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A7BB5">/ingest-source · /query-wiki · /wiki-lint</text>
  <text x="970" y="484" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">两步摄入 / 溯源问答 / 体检</text>
  <text x="590" y="514" font-family="Consolas, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A7BB5">/paper-outline · /paper-draft · /paper-refine</text>
  <text x="970" y="514" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">大纲 / 账本成稿 / 3轮精修</text>

  <rect x="590" y="544" width="604" height="92" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <text x="610" y="576" font-family="Consolas, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">/research-pipeline</text>
  <text x="820" y="576" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#C07B00">总控编排 Skill（1 个）</text>
  <text x="610" y="610" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">串联 S1–S12 全流程，每阶段停在研究者关卡，含独立审稿闭环。</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Part 2 · Economics Research Crew 科研实战</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">13 / 18</text>
</svg>
