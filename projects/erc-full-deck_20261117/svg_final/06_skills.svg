<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A7BB5" letter-spacing="1.5">PART 01 · 基础概念 (03 / 08)</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">基础 ③ | Skills：模型按需自动调用的能力包</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <!-- Left: Folder Structure & Loading -->
  <rect x="64" y="146" width="540" height="510" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="64" y="146" width="540" height="46" fill="#1A3A6B"/>
  <!-- icon: tabler-outline/package -->
  <g transform="translate(82, 156)" fill="none" stroke="#E8A317" stroke-width="2">
    <path d="M12 3l8 4.5l0 9l-8 4.5l-8 -4.5l0 -9l8 -4.5" />
    <path d="M12 12l8 -4.5" />
    <path d="M12 12l0 9" />
    <path d="M12 12l-8 -4.5" />
    <path d="M16 5.25l-8 4.5" />
  </g>
  <text x="116" y="176" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">Skill 的本质：能力文件夹 (Folder Package)</text>

  <rect x="88" y="210" width="492" height="196" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="108" y="242" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">.claude/skills/&lt;skill-name&gt;/</text>
  <text x="128" y="274" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#C07B00">├── SKILL.md</text>
  <text x="278" y="274" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">YAML 元数据 (name/description) + 指令</text>
  <text x="128" y="306" font-family="Consolas, Arial, sans-serif" font-size="15" fill="#1D2430">├── scripts/</text>
  <text x="278" y="306" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">可执行的 Python / Shell 辅助脚本</text>
  <text x="128" y="338" font-family="Consolas, Arial, sans-serif" font-size="15" fill="#1D2430">├── templates/</text>
  <text x="278" y="338" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">标准输出模板与参考样例</text>
  <text x="128" y="370" font-family="Consolas, Arial, sans-serif" font-size="15" fill="#1D2430">└── references/</text>
  <text x="278" y="370" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">按需读取的补充文档（省上下文）</text>

  <text x="88" y="442" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">4 种来源与作用域：</text>
  <text x="88" y="476" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Pre-built 内置：全局可用（如 pptx / xlsx / docx / pdf）</text>
  <text x="88" y="508" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Personal 个人：~/.claude/skills/（个人自动化）</text>
  <text x="88" y="540" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Project 项目：.claude/skills/（Git 共享团队标准）</text>
  <text x="88" y="572" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Plugin 插件：随插件安装自动注册</text>
  <text x="88" y="620" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A7BB5">注：也支持用户直接输入 /skill-name 显式触发</text>

  <!-- Right: Skill vs Slash Command Contrast -->
  <rect x="632" y="146" width="584" height="510" rx="4" fill="#FFFFFF" stroke="#1A3A6B" stroke-width="1.5"/>
  <rect x="632" y="146" width="584" height="46" fill="#4A7BB5"/>
  <text x="654" y="176" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">高频混淆点：Skills vs. Slash Commands</text>

  <text x="656" y="232" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">1. 触发机制不同（最核心差异）</text>
  <text x="656" y="262" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Slash Command：用户显式输入 /cmd 才执行。</text>
  <text x="656" y="288" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Skill：启动时只加载 YAML 摘要，模型根据用户</text>
  <text x="670" y="314" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">需求语义自动匹配并按需读入完整 SKILL.md。</text>

  <line x1="656" y1="338" x2="1192" y2="338" stroke="#DCE2EA" stroke-width="1"/>

  <text x="656" y="374" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">2. 载体复杂度不同</text>
  <text x="656" y="404" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Slash Command：单个 Markdown 提示词文件。</text>
  <text x="656" y="430" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Skill：完整目录，可打包脚本、模板与参考手册，</text>
  <text x="670" y="456" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">实现“渐进式披露 (Progressive Disclosure)”。</text>

  <line x1="656" y1="480" x2="1192" y2="480" stroke="#DCE2EA" stroke-width="1"/>

  <rect x="656" y="502" width="536" height="130" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <text x="676" y="534" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#C07B00">3. 何时用哪个？</text>
  <text x="676" y="566" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 简单单步快捷操作 → Slash Command</text>
  <text x="676" y="596" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 带多步检查点、脚本和模板的专业工作流 → Skill</text>
  <text x="676" y="622" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">（Part 2 的 14 个科研流程全部采用 Skill 封装）</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Part 1 · Claude Code 基础概念（claude-howto）</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">06 / 18</text>
</svg>
