<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317" letter-spacing="1.5">PART 02 · 关键概念拆解 (02 / 08)</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">02 | Skills：用 /命令 触发标准化科研 SOP</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <rect x="64" y="144" width="620" height="516" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="64" y="144" width="620" height="48" fill="#1A3A6B"/>
  <use data-icon="tabler-outline/terminal-2" x="82" y="154" width="26" height="26" fill="#E8A317"/>
  <text x="118" y="175" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">研究推进类 Skills（7 个）—— 覆盖从选题到审稿</text>

  <text x="88" y="226" font-family="Consolas, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">/research-question</text>
  <text x="316" y="226" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">收敛可检验问题与 Estimand（≤3 候选）</text>
  <line x1="88" y1="242" x2="660" y2="242" stroke="#DCE2EA" stroke-width="1"/>

  <text x="88" y="276" font-family="Consolas, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">/literature-review</text>
  <text x="316" y="276" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">带来源的文献梳理、矩阵与研究缺口</text>
  <line x1="88" y1="292" x2="660" y2="292" stroke="#DCE2EA" stroke-width="1"/>

  <text x="88" y="326" font-family="Consolas, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">/theory-modeling</text>
  <text x="316" y="326" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">设定、假设、逐步推导与比较静态</text>
  <line x1="88" y1="342" x2="660" y2="342" stroke="#DCE2EA" stroke-width="1"/>

  <text x="88" y="376" font-family="Consolas, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">/tax-policy-analysis</text>
  <text x="316" y="376" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">税制法源、征管遵从与税负归宿分析</text>
  <line x1="88" y1="392" x2="660" y2="392" stroke="#DCE2EA" stroke-width="1"/>

  <text x="88" y="426" font-family="Consolas, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">/causal-inference-audit</text>
  <text x="316" y="426" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">DID/IV/RDD 识别审计与因果措辞边界</text>
  <line x1="88" y1="442" x2="660" y2="442" stroke="#DCE2EA" stroke-width="1"/>

  <text x="88" y="476" font-family="Consolas, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">/econometric-analysis</text>
  <text x="316" y="476" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">数据审计、回归实现与论文复现模式</text>
  <line x1="88" y1="492" x2="660" y2="492" stroke="#DCE2EA" stroke-width="1"/>

  <text x="88" y="526" font-family="Consolas, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A3A6B">/academic-review</text>
  <text x="316" y="526" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">Fatal / Major / Minor 分级对抗挑刺</text>
  <line x1="88" y1="542" x2="660" y2="542" stroke="#DCE2EA" stroke-width="1"/>

  <rect x="88" y="564" width="572" height="76" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="108" y="594" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">为什么不能只靠“口头聊天”？</text>
  <text x="108" y="622" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">每个 Skill 封装了强制步骤、检查点与 Templates/ 输出格式，防跳步。</text>

  <rect x="708" y="144" width="508" height="176" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="708" y="144" width="508" height="44" fill="#4A7BB5"/>
  <text x="728" y="173" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">知识库维护类 Skills（3 个）</text>
  <text x="728" y="218" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">/ingest-source</text>
  <text x="884" y="218" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">SHA256 去重 + 确认后写入 Wiki</text>
  <text x="728" y="254" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">/query-wiki</text>
  <text x="884" y="254" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">先查 index，区分依据与推断</text>
  <text x="728" y="290" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">/wiki-lint</text>
  <text x="884" y="290" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">断链、孤立页、溯源与矛盾体检</text>

  <rect x="708" y="340" width="508" height="176" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="708" y="340" width="508" height="44" fill="#274E8A"/>
  <text x="728" y="369" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">论文写作类 Skills（3 个 · S8–S12）</text>
  <text x="728" y="414" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">/paper-outline</text>
  <text x="884" y="414" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">产出主张清单与证据强度映射</text>
  <text x="728" y="450" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">/paper-draft</text>
  <text x="884" y="450" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">仅用引文表与结果账本成稿</text>
  <text x="728" y="486" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">/paper-refine</text>
  <text x="884" y="486" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">最多 3 轮精修，改进才接受</text>

  <rect x="708" y="536" width="508" height="124" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="2"/>
  <text x="728" y="572" font-family="Consolas, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">/research-pipeline</text>
  <text x="954" y="572" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#C07B00">总控编排 Skill（1 个）</text>
  <text x="728" y="606" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">承担 Research Director 职责，串联 S1–S12 全阶段，</text>
  <text x="728" y="634" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">支持断点续跑、人工关卡停顿与 Reviewer 质量闭环。</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Economics Research Crew · 关键概念解析</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">05 / 12</text>
</svg>
