  <text x="1108" y="410" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">引文率 / 链接率达标</text>
  <text x="1108" y="434" text-anchor="middle" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#DCE6F2">paper_tools report</text>

  <rect x="64" y="476" width="366" height="184" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="64" y="476" width="6" height="184" fill="#1A3A6B"/>
  <text x="88" y="512" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A3A6B">1. 持久化状态与断点续跑</text>
  <text x="88" y="544" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">状态存放在 STATE.json，派出历史记入</text>
  <text x="88" y="570" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">Meta/run-ledger.jsonl。中断后只需运行</text>
  <text x="88" y="596" font-family="Consolas, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A7BB5">orchestrator.py next</text>
  <text x="88" y="622" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">即可接续当前阶段，不重做已过关卡。</text>

  <rect x="457" y="476" width="366" height="184" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="457" y="476" width="6" height="184" fill="#E8A317"/>
  <text x="481" y="512" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A3A6B">2. 重试熔断与并发上限</text>
  <text x="481" y="544" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">每个 Agent 在单阶段最多重试 2 次，</text>
  <text x="481" y="570" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">耗尽即停下向研究者汇报（防止死循环）。</text>
  <text x="481" y="596" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">并发默认 1（S3 最多 2，硬上限 3）。</text>
  <text x="481" y="622" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">产物与日志校验通过后才允许过关。</text>

  <rect x="850" y="476" width="366" height="184" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <text x="874" y="512" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#C07B00">3. 关卡只由研究者决定</text>
  <text x="874" y="544" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">AI 严禁自行运行 gate --decision pass。</text>
  <text x="874" y="570" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">脚本强制要求 --note，并在 Claude Code</text>
  <text x="874" y="596" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">下通过 Hook 弹出权限确认提示，</text>
  <text x="874" y="622" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">确保每个关键节点由人拍板。</text>

