  <text x="874" y="394" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1D2430">最多 3 轮 · 改进才收</text>
  <text x="874" y="422" text-anchor="middle" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#5A6577">/paper-refine</text>

