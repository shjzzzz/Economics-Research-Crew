<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Header -->
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317" letter-spacing="1.5">PART 01 · 总体架构</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">四层协同模型：如何把研究工作管起来</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <!-- Layer 1 -->
  <rect x="64" y="146" width="320" height="110" rx="4" fill="#1A3A6B"/>
  <use data-icon="tabler-outline/shield-check" x="84" y="166" width="28" height="28" fill="#E8A317"/>
  <text x="122" y="188" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">L1 规则层 (Rules)</text>
  <text x="84" y="222" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#DCE6F2">每次会话自动加载的“科研宪法”</text>
  <rect x="404" y="146" width="812" height="110" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="428" y="182" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#1D2430">核心职责：定义路由优先级、证据铁律、计量纪律与数据只读底线</text>
  <text x="428" y="214" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#5A6577">核心文件：CLAUDE.md + .claude/ECONOMICS-RESEARCH.md（Claude Code）  |  AGENTS.md（agy / Codex）</text>
  <text x="428" y="240" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#4A7BB5">解决：不用每次对话重复叮嘱“别编文献、先定 estimand”</text>

  <!-- Arrow 1->2 -->
  <line x1="224" y1="256" x2="224" y2="278" stroke="#4A7BB5" stroke-width="2"/>
  <polygon points="218,274 230,274 224,282" fill="#4A7BB5"/>

  <!-- Layer 2 -->
  <rect x="64" y="282" width="320" height="110" rx="4" fill="#274E8A"/>
  <use data-icon="tabler-outline/users" x="84" y="302" width="28" height="28" fill="#E8A317"/>
  <text x="122" y="324" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">L2 能力层 (Skills/Agents)</text>
  <text x="84" y="358" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#DCE6F2">标准化流程 + 权限隔离的执行团队</text>
  <rect x="404" y="282" width="812" height="110" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="428" y="318" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#1D2430">核心职责：14 个 Skill 固化研究/写作/Wiki SOP；7 个 Subagent 分工执行与独立审稿</text>
  <text x="428" y="350" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#5A6577">核心目录：.claude/skills/*/SKILL.md  ·  .claude/agents/*.md（含只读 academic-reviewer）</text>
  <text x="428" y="376" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#4A7BB5">解决：防跳步、防长上下文污染、杜绝“自己写自己审”</text>

  <!-- Arrow 2->3 -->
  <line x1="224" y1="392" x2="224" y2="414" stroke="#4A7BB5" stroke-width="2"/>
  <polygon points="218,410 230,410 224,418" fill="#4A7BB5"/>

  <!-- Layer 3 -->
  <rect x="64" y="418" width="320" height="110" rx="4" fill="#4A7BB5"/>
  <use data-icon="tabler-outline/git-branch" x="84" y="438" width="28" height="28" fill="#FFFFFF"/>
  <text x="122" y="460" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">L3 控制层 (Director/Hooks)</text>
  <text x="84" y="494" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#FFFFFF">S1–S12 状态机 + 技术拦截网</text>
  <rect x="404" y="418" width="812" height="110" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="428" y="454" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#1D2430">核心职责：orchestrator.py 管进度与人工关卡；6 个 Python Hook 拦越权与护数据</text>
  <text x="428" y="486" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#5A6577">核心文件：scripts/orchestrator.py  ·  pipeline-stages.json  ·  hooks/*.py</text>
  <text x="428" y="512" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#4A7BB5">解决：研究中断可续跑、AI 无法越级推进或私自放行关卡</text>

  <!-- Arrow 3->4 -->
  <line x1="224" y1="528" x2="224" y2="550" stroke="#4A7BB5" stroke-width="2"/>
  <polygon points="218,546 230,546 224,554" fill="#4A7BB5"/>

  <!-- Layer 4 -->
  <rect x="64" y="554" width="320" height="110" rx="4" fill="#1D2430"/>
  <use data-icon="tabler-outline/database" x="84" y="574" width="28" height="28" fill="#E8A317"/>
  <text x="122" y="596" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">L4 沉淀层 (Wiki &amp; Paper)</text>
  <text x="84" y="630" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#DCE6F2">可积累的知识库与可追溯论文产出</text>
  <rect x="404" y="554" width="812" height="110" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="428" y="590" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#1D2430">核心职责：Wiki 两步摄入与体检；paper_tools.py 锁死引文表与实证数字账本</text>
  <text x="428" y="622" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#5A6577">核心目录：Meta/（index、log、citation-map、results-ledger） · 03-Literature/ · 06-Data/</text>
  <text x="428" y="648" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#4A7BB5">解决：知识跨项目复利积累，成稿每个数字与引文都可机械溯源</text>

  <!-- Footer -->
  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Economics Research Crew · 关键概念解析</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">03 / 12</text>
</svg>
