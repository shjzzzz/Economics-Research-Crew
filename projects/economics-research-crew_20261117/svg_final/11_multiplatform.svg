  <rect x="1064" y="492" width="128" height="32" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1"/>
  <text x="1128" y="514" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#C07B00">agy 1.5.9 冒烟</text>

  <!-- Row 3: Codex CLI -->
