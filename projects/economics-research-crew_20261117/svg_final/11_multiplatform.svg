  <rect x="1064" y="398" width="118" height="32" rx="4" fill="#E6F4EA"/>
  <text x="1123" y="420" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#137333">已完整测试</text>

