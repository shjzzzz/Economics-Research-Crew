  <rect x="444" y="144" width="360" height="122" rx="4" fill="#F4F6F8" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="464" y="178" font-family="Consolas, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A3A6B">Install-EconomicsResearchCrew.ps1</text>
  <text x="464" y="208" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• -Platform auto 自动检测已装 CLI</text>
  <text x="464" y="234" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• -Update 差异文件生成 .new 不覆盖</text>
  <text x="464" y="256" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#5A6577">Sync-AgentsMd.ps1 同步 CLAUDE.md → AGENTS.md</text>

  <line x1="804" y1="205" x2="858" y2="205" stroke="#4A7BB5" stroke-width="2.5"/>
  <polygon points="854,199 864,205 854,211" fill="#4A7BB5"/>

  <rect x="864" y="144" width="352" height="122" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <text x="884" y="180" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#C07B00">安全安装原则</text>
  <text x="884" y="212" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 已存在文件一律跳过并列出</text>
  <text x="884" y="240" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 改动前备份至 _erc-backups/&lt;时间&gt;/</text>

  <!-- Platform Comparison Table -->
  <text x="64" y="308" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">三大平台生成结构与能力对比</text>

