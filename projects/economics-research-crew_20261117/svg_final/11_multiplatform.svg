  <text x="84" y="530" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#E8A317">原生支持</text>
  <text x="276" y="502" font-family="Consolas, Arial, sans-serif" font-size="15" fill="#1D2430">根 AGENTS.md 区块</text>
  <text x="276" y="528" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">自包含（≤24 KB）</text>
  <text x="536" y="502" font-family="Consolas, Arial, sans-serif" font-size="15" fill="#1D2430">.agents/skills/</text>
  <text x="536" y="528" font-family="Consolas, Arial, sans-serif" font-size="15" fill="#1D2430">.agents/agents/</text>
  <text x="776" y="500" font-family="Consolas, Arial, sans-serif" font-size="14" fill="#1D2430">.agents/hooks.json</text>
