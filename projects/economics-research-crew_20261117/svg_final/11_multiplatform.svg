  <text x="276" y="410" font-family="Consolas, Arial, sans-serif" font-size="15" fill="#1D2430">CLAUDE.md +</text>
  <text x="276" y="436" font-family="Consolas, Arial, sans-serif" font-size="14" fill="#5A6577">.claude/ECONOMICS-RESEARCH.md</text>
  <text x="536" y="410" font-family="Consolas, Arial, sans-serif" font-size="15" fill="#1D2430">.claude/skills/</text>
