<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317" letter-spacing="1.5">PART 02 · 关键概念拆解 (05 / 08)</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">05 | Hooks：把“口头约束”变成技术拦截</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <rect x="64" y="144" width="366" height="426" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="64" y="144" width="366" height="44" fill="#1A3A6B"/>
  <!-- icon: tabler-outline/lock -->
  <g transform="translate(82, 153)" fill="none" stroke="#E8A317" stroke-width="2">
    <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" />
    <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
    <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
  </g>
  <text x="116" y="173" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1. 提示与事前拦截 (Pre)</text>

  <rect x="84" y="206" width="326" height="106" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="100" y="234" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">routing_hint.py</text>
  <text x="100" y="262" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">每轮首次调用前注入路由提示，提醒</text>
  <text x="100" y="286" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">优先匹配项目 Skill（Claude / agy）。</text>

  <rect x="84" y="328" width="326" height="222" rx="4" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="100" y="356" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#C0392B">protect_raw.py (PreToolUse)</text>
  <text x="100" y="388" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">• 精确拦截 Write / Edit 修改</text>
  <text x="112" y="412" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">06-Data/raw 与 03-Literature/_sources</text>
  <text x="112" y="436" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">中已存在的文件（允许新建导入）。</text>
  <text x="100" y="468" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">• 启发式拦截危险 Bash 命令</text>
  <text x="112" y="492" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">（rm / mv / 重定向等涉及受保护路径）。</text>
  <text x="100" y="526" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#4A7BB5">agy 下放行时返回 ask，沿用审批流程</text>

  <line x1="430" y1="357" x2="452" y2="357" stroke="#4A7BB5" stroke-width="2.5"/>
  <polygon points="448,351 458,357 448,363" fill="#4A7BB5"/>

  <rect x="457" y="144" width="366" height="426" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="457" y="144" width="366" height="44" fill="#274E8A"/>
  <!-- icon: tabler-outline/git-branch -->
  <g transform="translate(475, 153)" fill="none" stroke="#E8A317" stroke-width="2">
    <path d="M5 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M5 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M15 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M7 8l0 8" />
    <path d="M9 18h6a2 2 0 0 0 2 -2v-5" />
    <path d="M14 14l3 -3l3 3" />
  </g>
  <text x="509" y="173" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2. 编排守卫 (Claude Code)</text>

  <rect x="477" y="206" width="326" height="206" rx="4" fill="#FFFFFF" stroke="#E8A317" stroke-width="1.5"/>
  <text x="493" y="234" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">orchestrator_guard.py</text>
  <text x="493" y="266" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">• 阻止派出后续阶段的 Agent（防跳步）</text>
  <text x="493" y="294" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">• 阻止单阶段重试耗尽（&gt;2 次）后继续派出</text>
  <text x="493" y="322" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">• 阻止超出阶段并发上限</text>
  <text x="493" y="350" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">• 阻止直接编辑 STATE.json / run-ledger</text>
  <text x="493" y="388" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#C07B00">注：agy / Codex 无此拦截层，靠规则遵守</text>

  <rect x="477" y="428" width="326" height="122" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="493" y="456" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">orchestrator_record.py</text>
  <text x="493" y="486" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">自动记录 Subagent 派出与完成事件，</text>
  <text x="493" y="512" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">写入 Meta/run-ledger.jsonl 账本。</text>

  <line x1="823" y1="357" x2="845" y2="357" stroke="#4A7BB5" stroke-width="2.5"/>
  <polygon points="841,351 851,357 841,363" fill="#4A7BB5"/>

  <rect x="850" y="144" width="366" height="426" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="850" y="144" width="366" height="44" fill="#4A7BB5"/>
  <!-- icon: tabler-outline/shield-check -->
  <g transform="translate(868, 153)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
  <text x="902" y="173" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3. 事后校验 (PostToolUse)</text>

  <rect x="870" y="206" width="326" height="162" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="886" y="234" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">validate_frontmatter.py</text>
  <text x="886" y="266" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">写入 .md 笔记后自动检查 YAML</text>
  <text x="886" y="292" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">frontmatter 是否闭合、有无非法 Tab，</text>
  <text x="886" y="318" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">发现问题即时反馈给 AI 修复。</text>

  <rect x="870" y="384" width="326" height="166" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="886" y="412" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">validate_paper.py</text>
  <text x="886" y="444" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">针对论文草稿写入的自动校验，</text>
  <text x="886" y="470" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#1D2430">检查 [@key]、{{res:id}} 与未答</text>
  <text x="886" y="496" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">问题标记，防止手写未登记引用。</text>

  <rect x="64" y="590" width="1152" height="70" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <text x="84" y="620" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#1D2430">坦诚的工程边界（Limitation）：</text>
  <text x="336" y="620" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#1D2430">安装时加 -WithHooks 才启用；Bash 拦截仅为关键字启发式检查，输入异常时 fail-open。</text>
  <text x="84" y="646" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5A6577">Hooks 是在规则文本之外增加的技术护栏，而非操作系统级沙箱——Git 版本控制与定期备份依然不可或缺。</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Economics Research Crew · 关键概念解析</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">08 / 12</text>
</svg>
