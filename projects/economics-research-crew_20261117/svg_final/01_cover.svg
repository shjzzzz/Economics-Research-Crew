<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Left Hero Navy Field -->
  <rect x="0" y="0" width="780" height="720" fill="#1A3A6B"/>
  <!-- Amber Accent Rule -->
  <rect x="64" y="132" width="72" height="6" fill="#E8A317"/>
  <!-- Kicker -->
  <text x="64" y="178" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E8A317" letter-spacing="2">ECONOMICS RESEARCH CREW · 项目导览</text>
  <!-- Main Title -->
  <text x="64" y="256" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">让 AI 严谨参与</text>
  <text x="64" y="320" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">经济学研究的工程体系</text>
  <!-- Subtitle -->
  <text x="64" y="388" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#DCE6F2">面向公共财政、税收政策与因果推断研究的</text>
  <text x="64" y="422" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#DCE6F2">规则、技能、子代理、编排器与可积累知识库</text>
  <!-- Three Pillars Tags -->
  <rect x="64" y="484" width="148" height="44" rx="4" fill="#274E8A"/>
  <text x="138" y="513" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">可追溯</text>
  <rect x="228" y="484" width="148" height="44" rx="4" fill="#274E8A"/>
  <text x="302" y="513" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">可审查</text>
  <rect x="392" y="484" width="148" height="44" rx="4" fill="#274E8A"/>
  <text x="466" y="513" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">可积累</text>
  <!-- Bottom Platform Line -->
  <line x1="64" y1="612" x2="716" y2="612" stroke="#365D99" stroke-width="1.5"/>
  <text x="64" y="648" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#B8C9E0">支持平台：Claude Code  ·  Antigravity CLI (agy)  ·  Codex CLI</text>

  <!-- Right Side: Minimal 4-Layer Preview Stack -->
  <text x="828" y="148" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#5A6577">核心架构一览</text>
  <line x1="828" y1="164" x2="1216" y2="164" stroke="#DCE2EA" stroke-width="1.5"/>

  <rect x="828" y="190" width="388" height="96" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="828" y="190" width="6" height="96" fill="#1A3A6B"/>
  <!-- icon: tabler-outline/shield-check -->
  <g transform="translate(852, 218) scale(1.33333)" fill="none" stroke="#1A3A6B" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
  <text x="900" y="228" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1D2430">01 规则层 (Rules)</text>
  <text x="900" y="260" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5A6577">证据铁律 · 计量纪律 · 原始数据只读</text>

  <rect x="828" y="304" width="388" height="96" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="828" y="304" width="6" height="96" fill="#4A7BB5"/>
  <!-- icon: tabler-outline/terminal-2 -->
  <g transform="translate(852, 332) scale(1.33333)" fill="none" stroke="#4A7BB5" stroke-width="2">
    <path d="M8 9l3 3l-3 3" />
    <path d="M13 15l3 0" />
    <path d="M3 6a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -12" />
  </g>
  <text x="900" y="342" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1D2430">02 能力层 (14 Skills / 7 Agents)</text>
  <text x="900" y="374" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5A6577">标准化 SOP · 权限分级 · 独立审稿</text>

  <rect x="828" y="418" width="388" height="96" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="828" y="418" width="6" height="96" fill="#E8A317"/>
  <!-- icon: tabler-outline/git-branch -->
  <g transform="translate(852, 446) scale(1.33333)" fill="none" stroke="#E8A317" stroke-width="2">
    <path d="M5 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M5 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M15 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M7 8l0 8" />
    <path d="M9 18h6a2 2 0 0 0 2 -2v-5" />
    <path d="M14 14l3 -3l3 3" />
  </g>
  <text x="900" y="456" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1D2430">03 控制层 (Orchestrator &amp; Hooks)</text>
  <text x="900" y="488" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5A6577">S1–S12 状态机 · 人工关卡 · 技术拦截</text>

  <rect x="828" y="532" width="388" height="96" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="828" y="532" width="6" height="96" fill="#1A3A6B"/>
  <!-- icon: tabler-outline/database -->
  <g transform="translate(852, 560) scale(1.33333)" fill="none" stroke="#1A3A6B" stroke-width="2">
    <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" />
    <path d="M4 6v6a8 3 0 0 0 16 0v-6" />
    <path d="M4 12v6a8 3 0 0 0 16 0v-6" />
  </g>
  <text x="900" y="570" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1D2430">04 沉淀层 (Wiki &amp; Paper Tools)</text>
  <text x="900" y="602" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5A6577">两步摄入 · 引文/数字账本 · 体检</text>
</svg>
