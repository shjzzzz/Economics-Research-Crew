<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317" letter-spacing="1.5">PART 02 · 关键概念拆解 (07 / 08)</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">07 | 人机协作写稿：引文与数字的机械可追溯</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <!-- Top 4-Step Flow -->
  <rect x="64" y="144" width="264" height="118" rx="4" fill="#F4F6F8" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="82" y="176" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">1. /paper-outline (C1)</text>
  <text x="82" y="206" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">生成 paper/outline.md</text>
  <text x="82" y="232" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">列明每条主张的证据 id</text>
  <text x="82" y="252" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">与允许的因果措辞强度</text>

  <line x1="328" y1="203" x2="354" y2="203" stroke="#4A7BB5" stroke-width="2.5"/>
  <polygon points="350,197 360,203 350,209" fill="#4A7BB5"/>

  <rect x="360" y="144" width="264" height="118" rx="4" fill="#F4F6F8" stroke="#4A7BB5" stroke-width="1.5"/>
  <text x="378" y="176" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A6B">2. 账本登记 (C2)</text>
  <text x="378" y="206" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">paper_tools.py 维护</text>
  <text x="378" y="232" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#5A6577">Meta/citation-map.json</text>
  <text x="378" y="252" font-family="Consolas, Arial, sans-serif" font-size="13" fill="#5A6577">Meta/results-ledger.json</text>

  <line x1="624" y1="203" x2="650" y2="203" stroke="#4A7BB5" stroke-width="2.5"/>
  <polygon points="646,197 656,203 646,209" fill="#4A7BB5"/>

  <rect x="656" y="144" width="264" height="118" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <text x="674" y="176" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#C07B00">3. /paper-draft (C3)</text>
  <text x="674" y="206" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">输入受限：只用两张账本</text>
  <text x="674" y="232" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">机械校验 [@key] 与</text>
  <text x="674" y="252" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">{{res:id}} 及未答提问</text>

  <line x1="920" y1="203" x2="946" y2="203" stroke="#4A7BB5" stroke-width="2.5"/>
  <polygon points="942,197 952,203 942,209" fill="#4A7BB5"/>

  <rect x="952" y="144" width="264" height="118" rx="4" fill="#1A3A6B"/>
  <text x="970" y="176" font-family="Consolas, Arial, sans-serif" font-size="16" font-weight="bold" fill="#E8A317">4. /paper-refine (C4-5)</text>
  <text x="970" y="206" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#FFFFFF">最多 3 轮 · 改进才接受</text>
  <text x="970" y="232" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#DCE6F2">未增 Fatal 且减少 Major</text>
  <text x="970" y="252" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#DCE6F2">支持 pandoc 导出 docx/tex</text>

  <!-- Bottom 3 Cards: 3 Inline Markers -->
  <text x="64" y="310" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">稿内三大机械锚定标记（杜绝 AI 写稿“自由发挥”）</text>

  <rect x="64" y="330" width="366" height="248" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="64" y="330" width="366" height="54" fill="#1A3A6B"/>
  <text x="247" y="365" text-anchor="middle" font-family="Consolas, Arial, sans-serif" font-size="22" font-weight="bold" fill="#E8A317">[@key]</text>
  <text x="86" y="416" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">引文机械绑定</text>
  <text x="86" y="448" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 仅限 citation-map.json 已登记 key</text>
  <text x="86" y="476" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• Crossref 核验只发标题/DOI，不发正文</text>
  <text x="86" y="504" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 可加 --offline / ERC_OFFLINE=1 断网</text>
  <text x="86" y="532" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">• 中文文献与法规须人工 cite confirm</text>

  <rect x="457" y="330" width="366" height="248" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="457" y="330" width="366" height="54" fill="#4A7BB5"/>
  <text x="640" y="365" text-anchor="middle" font-family="Consolas, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">{{res:id}}</text>
  <text x="479" y="416" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">实证数字机械绑定</text>
  <text x="479" y="448" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 正文回归系数、样本量、显著性等数字</text>
  <text x="493" y="474" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">一律写成 {{res:id}} 占位符</text>
  <text x="479" y="504" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 从 results-ledger.json 自动导入 CSV</text>
  <text x="479" y="532" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">• 杜绝 AI 改写数字或四舍五入出错</text>

  <rect x="850" y="330" width="366" height="248" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="850" y="330" width="366" height="54" fill="#E8A317"/>
  <text x="1033" y="365" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="bold" fill="#1D2430">⟦问：…⟧ / ⟦答：…⟧</text>
  <text x="872" y="416" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A3A6B">显式提问替代脑补</text>
  <text x="872" y="448" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 遇到证据缺口时，AI 不准自行编造，</text>
  <text x="886" y="474" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">必须用 ⟦问：…⟧ 在稿内显式提问</text>
  <text x="872" y="504" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#1D2430">• 需补跑实证的意见进入 review-queue</text>
  <text x="872" y="532" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">• 终检前未答问题数必须清零</text>

  <!-- Bottom Protocol Note -->
  <rect x="64" y="598" width="1152" height="62" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="84" y="635" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430"><tspan font-weight="bold" fill="#1A3A6B">自主权边界 (Meta/collaboration-protocol.md)：</tspan>AI 永远不决定识别策略、不拔高因果措辞强度、不决定投稿期刊。</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Economics Research Crew · 关键概念解析</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">10 / 12</text>
</svg>
