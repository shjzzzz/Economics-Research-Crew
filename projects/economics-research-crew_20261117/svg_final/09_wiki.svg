<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="54" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E8A317" letter-spacing="1.5">PART 02 · 关键概念拆解 (06 / 08)</text>
  <text x="64" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A3A6B">06 | 可积累 Wiki：越用越厚的三层知识库</text>
  <line x1="64" y1="122" x2="1216" y2="122" stroke="#DCE2EA" stroke-width="1.5"/>

  <!-- Left: 3-Layer Stack -->
  <text x="64" y="160" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">三层知识沉淀结构（借鉴 llm_wiki）</text>

  <rect x="64" y="182" width="460" height="128" rx="4" fill="#1A3A6B"/>
  <!-- icon: tabler-outline/lock -->
  <g transform="translate(86, 204) scale(1.16667)" fill="none" stroke="#E8A317" stroke-width="2">
    <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" />
    <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
    <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
  </g>
  <text x="126" y="226" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">第一层：原始来源（不可变）</text>
  <text x="86" y="262" font-family="Consolas, Arial, sans-serif" font-size="15" fill="#E8A317">03-Literature/_sources/</text>
  <text x="86" y="290" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#DCE6F2">存放 PDF、剪藏原文；只读保护 + SHA256 登记去重</text>

  <line x1="294" y1="310" x2="294" y2="338" stroke="#4A7BB5" stroke-width="2.5"/>
  <polygon points="288,334 300,334 294,342" fill="#4A7BB5"/>

  <rect x="64" y="342" width="460" height="148" rx="4" fill="#F4F6F8" stroke="#4A7BB5" stroke-width="2"/>
  <!-- icon: tabler-outline/database -->
  <g transform="translate(86, 364) scale(1.16667)" fill="none" stroke="#4A7BB5" stroke-width="2">
    <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" />
    <path d="M4 6v6a8 3 0 0 0 16 0v-6" />
    <path d="M4 12v6a8 3 0 0 0 16 0v-6" />
  </g>
  <text x="126" y="386" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">第二层：Wiki 页面（人机共建）</text>
  <text x="86" y="422" font-family="Consolas, Arial, sans-serif" font-size="14" fill="#1D2430">03-Literature/ · 04-Theories/ · 08-Research-Notes/</text>
  <text x="86" y="450" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">每条主张溯源到页码/表号；frontmatter 标注</text>
  <text x="86" y="474" font-family="Consolas, Arial, sans-serif" font-size="14" fill="#4A7BB5">type / sources / updated / verification</text>

  <line x1="294" y1="490" x2="294" y2="518" stroke="#4A7BB5" stroke-width="2.5"/>
  <polygon points="288,514 300,514 294,522" fill="#4A7BB5"/>

  <rect x="64" y="522" width="460" height="134" rx="4" fill="#FFFFFF" stroke="#1A3A6B" stroke-width="1.5"/>
  <!-- icon: tabler-outline/shield-check -->
  <g transform="translate(86, 544) scale(1.16667)" fill="none" stroke="#1A3A6B" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
  <text x="126" y="566" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">第三层：研究方向与规则</text>
  <text x="86" y="602" font-family="Consolas, Arial, sans-serif" font-size="15" fill="#4A7BB5">Meta/purpose.md + CLAUDE.md</text>
  <text x="86" y="630" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5A6577">每次摄入与问答前必读 purpose.md，不替研究者编方向</text>

  <!-- Right: 3 Operational Mechanisms -->
  <text x="564" y="160" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">三大维护机制：防止知识库腐烂</text>

  <rect x="564" y="182" width="652" height="148" rx="4" fill="#F4F6F8" stroke="#DCE2EA" stroke-width="1.5"/>
  <rect x="564" y="182" width="8" height="148" fill="#1A3A6B"/>
  <text x="592" y="218" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">1. 两步摄入 (/ingest-source)</text>
  <text x="592" y="250" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• 第 1 步（只读分析）：算 SHA256 去重，抽取要点、识别与已有页面的矛盾，</text>
  <text x="606" y="276" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">列出拟改动清单与未核实项，停下来等研究者确认。</text>
  <text x="592" y="306" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#4A7BB5">• 第 2 步（确认落盘）：写笔记 + 更新 Meta/index.md + 追加 research-log.md</text>

  <rect x="564" y="348" width="652" height="144" rx="4" fill="#FFF8E7" stroke="#E8A317" stroke-width="1.5"/>
  <text x="592" y="384" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#C07B00">2. 冲突显性化 (Meta/review-queue.md) &amp; 问答回存 (/query-wiki)</text>
  <text x="592" y="416" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• 不同文献出现结论矛盾时，AI 严禁私自裁决或静默覆盖，而是并列记录并</text>
  <text x="606" y="442" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">写入 Meta/review-queue.md 等待研究者裁决。</text>
  <text x="592" y="472" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#5A6577">• /query-wiki 先读 index 再读页面，回答严格区分“库内依据”与“推断”。</text>

  <rect x="564" y="510" width="652" height="146" rx="4" fill="#FFFFFF" stroke="#4A7BB5" stroke-width="1.5"/>
  <rect x="564" y="510" width="8" height="146" fill="#4A7BB5"/>
  <text x="592" y="546" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A3A6B">3. 确定性体检 (/wiki-lint &amp; wiki_lint.py)</text>
  <text x="592" y="578" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• 先跑 Python 确定性脚本再做语义检查；默认只报告、不自动修改。</text>
  <text x="592" y="606" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#1D2430">• 核查断链、孤立页、溯源缺失与 index 覆盖率。</text>
  <text x="592" y="634" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A7BB5">• 扫描范围只含新增研究目录，自动保护库内原有税法笔记不被误扫。</text>

  <line x1="64" y1="680" x2="1216" y2="680" stroke="#DCE2EA" stroke-width="1"/>
  <text x="64" y="702" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#5A6577">Economics Research Crew · 关键概念解析</text>
  <text x="1216" y="702" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A3A6B">09 / 12</text>
</svg>
